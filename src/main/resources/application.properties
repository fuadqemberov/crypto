server.address=127.0.0.1
server.port=8080
spring.thymeleaf.encoding=UTF-8
spring.web.resources.cache.period=1h
spring.task.scheduling.pool.size=2
spring.main.banner-mode=off
logging.pattern.console=%d{HH:mm:ss} %-5level %msg%n
bot.enabled=true
bot.base-url=https://fapi.binance.com
bot.data-dir=./data
bot.initial-balance=2000
bot.allocation=0.07
bot.leverage=3
bot.max-positions=5
bot.threshold=85
bot.min-quote-volume=10000000
bot.max-spread-bps=15
bot.fee-rate=0.0005
bot.slippage-bps=3
bot.risk-per-trade=0.005
bot.max-hold-ms=43200000
bot.stale-mark-ms=180000
bot.scan-delay-ms=60000
bot.monitor-delay-ms=5000
bot.request-spacing-ms=350
bot.symbols=
logging.file.name=./data/application.log
logging.logback.rollingpolicy.max-file-size=10MB
logging.logback.rollingpolicy.max-history=7
# --- Strategy (bot.strategy.*) — every threshold the signal engine and the broker use ---
# 1. Entry guard: fill vs reference and signal age, both checked at the real fill price
bot.strategy.max-entry-deviation-atr=0.25
bot.strategy.max-signal-age-sec=90
# 2. Breakout confirmation; entry-mode MARKET or LIMIT (limit at EMA20 +/- offset, cancelled after N 15m candles)
bot.strategy.min-breakout-atr=0.2
bot.strategy.entry-mode=MARKET
bot.strategy.limit-offset-atr=0.5
bot.strategy.limit-timeout-candles=3
# 3. Over-extension
bot.strategy.max-ema-distance-atr15m=1.5
bot.strategy.max-ema-distance-atr4h=4
bot.strategy.htf-stoch-extreme=90
bot.strategy.max-rel-vol4h=5
# 4. Structural stop: min(nearest support, 15m EMA20) - buffer*ATR, skip when wider than max-stop-atr
bot.strategy.structural-stop=true
bot.strategy.stop-buffer-atr=0.3
bot.strategy.min-stop-atr=1.0
bot.strategy.max-stop-atr=3.0
bot.strategy.atr-stop-multiple=2.0
# 5. Volume
bot.strategy.min-rel-vol15m=1.2
bot.strategy.min-rel-vol1h=0.8
# 6. RSI (LONG limits; SHORT uses 100 - x)
bot.strategy.rsi-scored-max15m=70
bot.strategy.rsi-gate-max15m=76
bot.strategy.rsi-max1h=72
bot.strategy.rsi-extreme15m=78
bot.strategy.rsi-max4h=85
bot.strategy.min-adx=25
bot.strategy.min-ema-slope-atr=0.05
bot.strategy.impulse-body-ratio=0.65
bot.strategy.min-bollinger-width-pct=0.4
bot.strategy.max-bollinger-width-pct=15
bot.strategy.min-atr-pct=0.1
bot.strategy.max-atr-pct=5
bot.strategy.target-room-r=2
bot.strategy.target-room-buffer-atr=0.25
bot.strategy.min-net-reward-risk=1.5
bot.strategy.max-funding-paid=0.0003
bot.strategy.max-funding-abs=0.001
# 7. Early exit ahead of the stop (replaces bot.stop-proximity, which was 0.15 x risk = 0.3 ATR)
bot.strategy.sl-proximity-enabled=true
bot.strategy.sl-proximity-atr=0.05
# 8. Portfolio
bot.strategy.btc-filter-enabled=true
bot.strategy.max-same-direction-positions=2
bot.strategy.consecutive-loss-cooldown-count=2
bot.strategy.cooldown-minutes=240
# 9. Weighted quality score (logged only, never gates)
bot.strategy.quality-weight-extension=25
bot.strategy.quality-weight-breakout=20
bot.strategy.quality-weight-htf-volume=20
bot.strategy.quality-weight-htf-room=15
bot.strategy.quality-weight-stop=10
bot.strategy.quality-weight-volume=10
# 10. Measurement: REJECTED events in order_history.txt
bot.strategy.log-rejected=true
