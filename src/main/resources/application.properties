spring.main.web-application-type=none
spring.task.scheduling.pool.size=2
spring.main.banner-mode=off
bot.enabled=true
bot.base-url=https://fapi.binance.com
bot.data-dir=./data
bot.initial-balance=2000
bot.allocation=0.07
bot.leverage=1
bot.max-positions=5
bot.threshold=90
bot.min-quote-volume=10000000
bot.max-spread-bps=15
bot.fee-rate=0.0005
bot.slippage-bps=3
bot.stop-proximity=0.15
bot.scan-delay-ms=60000
bot.monitor-delay-ms=5000
bot.request-spacing-ms=350
bot.symbols=
logging.file.name=./data/application.log
logging.logback.rollingpolicy.max-file-size=10MB
logging.logback.rollingpolicy.max-history=7
